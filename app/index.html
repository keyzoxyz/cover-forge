<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cover Forge — Poster Cover Art Maker</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header class="masthead">
    <h1 class="masthead__name">Cover Forge</h1>
    <p class="masthead__pitch">Forge sun-soaked, neon-drenched cover art from your own photos in seconds.</p>
  </header>

  <main class="workspace">
    <section class="controls" aria-label="Cover controls">
      <div class="panel">
        <h2 class="panel__title">Photos</h2>
        <label class="dropzone" for="photos">
          <span class="dropzone__icon" aria-hidden="true">+</span>
          <span class="dropzone__label">Drop 2–4 photos here</span>
          <span class="dropzone__hint">or click to browse</span>
          <input
            class="dropzone__input"
            type="file"
            id="photos"
            name="photos"
            accept="image/*"
            multiple
          >
        </label>
        <p class="field-note">Two to four images. The first fills the frame.</p>
      </div>

      <div class="panel">
        <h2 class="panel__title">Captions</h2>
        <div class="field-grid">
          <label class="field">
            <span class="field__label">Caption 1</span>
            <input type="text" id="caption-1" name="caption-1" maxlength="60" placeholder="Ride or die">
          </label>
          <label class="field">
            <span class="field__label">Caption 2</span>
            <input type="text" id="caption-2" name="caption-2" maxlength="60" placeholder="No rules tonight">
          </label>
          <label class="field">
            <span class="field__label">Caption 3</span>
            <input type="text" id="caption-3" name="caption-3" maxlength="60" placeholder="Sunset state of mind">
          </label>
          <label class="field">
            <span class="field__label">Caption 4</span>
            <input type="text" id="caption-4" name="caption-4" maxlength="60" placeholder="Outrun the law">
          </label>
        </div>
      </div>

      <div class="panel">
        <h2 class="panel__title">Poster</h2>
        <label class="field">
          <span class="field__label">Title</span>
          <input type="text" id="title" name="title" maxlength="40" placeholder="Vice City Nights" autocomplete="off">
        </label>

        <label class="field">
          <span class="field__label">Template</span>
          <select id="template" name="template">
            <option value="vice-dusk" selected>Vice Dusk</option>
            <option value="neon-rain">Neon Rain</option>
            <option value="sunset-heist">Sunset Heist</option>
          </select>
        </label>

        <label class="field">
          <span class="field__label">Palette</span>
          <select id="palette" name="palette">
            <option value="miami" selected>Miami Heat</option>
            <option value="midnight">Midnight Chrome</option>
            <option value="citrus">Citrus Blaze</option>
            <option value="vapor">Vapor Bloom</option>
          </select>
        </label>

        <button type="button" id="export" class="button button--primary">Export PNG</button>
      </div>

      <p id="status" class="status" role="status" aria-live="polite">Add 2–4 photos to begin.</p>
    </section>

    <section class="preview" aria-label="Poster preview">
      <div class="preview__frame">
        <canvas id="poster" width="1024" height="1024">Your browser does not support the canvas element.</canvas>
      </div>
      <img id="hidden-cover" alt="" hidden>
    </section>
  </main>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
