<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cover Forge — GTA 6 Style Cover Art Maker</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header class="masthead">
    <h1 class="masthead__name">Cover Forge</h1>
    <p class="masthead__pitch">Forge sun-drenched, neon-soaked cover art from your own photos.</p>
  </header>

  <main class="layout">
    <section class="controls" aria-label="Cover controls">
      <div class="field">
        <label class="field__label" for="photos">Photos <span class="field__hint">2–4 images</span></label>
        <div class="dropzone" id="dropzone" data-dropzone>
          <p class="dropzone__text">Drop 2–4 photos here or click to browse</p>
          <input
            class="dropzone__input"
            id="photos"
            name="photos"
            type="file"
            accept="image/*"
            multiple
          >
        </div>
      </div>

      <div class="field">
        <label class="field__label" for="caption-1">Captions</label>
        <div class="captions" id="captions">
          <input class="input" id="caption-1" name="caption-1" type="text" placeholder="Caption 1" autocomplete="off">
          <input class="input" id="caption-2" name="caption-2" type="text" placeholder="Caption 2" autocomplete="off">
          <input class="input" id="caption-3" name="caption-3" type="text" placeholder="Caption 3" autocomplete="off">
          <input class="input" id="caption-4" name="caption-4" type="text" placeholder="Caption 4" autocomplete="off">
        </div>
      </div>

      <div class="field">
        <label class="field__label" for="title">Title</label>
        <input class="input" id="title" name="title" type="text" placeholder="Enter a title" autocomplete="off" value="COVER FORGE">
      </div>

      <div class="field">
        <label class="field__label" for="template">Template</label>
        <select class="select" id="template" name="template">
          <option value="vice-dusk" selected>Vice Dusk</option>
          <option value="neon-rain">Neon Rain</option>
          <option value="sunset-heist">Sunset Heist</option>
        </select>
      </div>

      <div class="field">
        <label class="field__label" for="palette">Palette</label>
        <select class="select" id="palette" name="palette">
          <option value="miami" selected>Miami Heat</option>
          <option value="midnight">Midnight Neon</option>
          <option value="citrus">Citrus Punch</option>
          <option value="vapor">Vapor Chrome</option>
        </select>
      </div>

      <button class="btn btn--primary" id="export" type="button">Export PNG</button>
    </section>

    <section class="preview" aria-label="Cover preview">
      <div class="preview__frame">
        <canvas id="poster" width="1024" height="1024"></canvas>
      </div>
      <p class="status" id="status" role="status" aria-live="polite">Add 2–4 photos to begin.</p>
      <img id="hidden-cover" class="hidden" alt="Rendered cover" hidden>
    </section>
  </main>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
