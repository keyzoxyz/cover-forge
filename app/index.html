<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vice Cover Studio — GTA 6 Style Cover Art Maker</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header class="masthead">
    <h1>Vice Cover Studio</h1>
    <p class="pitch">Turn your snapshots into sun-soaked, neon-drenched cover art in seconds.</p>
  </header>

  <main class="workspace">
    <section class="controls" aria-label="Cover art controls">
      <div class="control-group">
        <h2>1. Photos</h2>
        <div id="drop-zone" class="drop-zone" tabindex="0">
          <p class="drop-zone__hint">Drop 2&ndash;4 photos here, or click to browse</p>
          <p class="drop-zone__meta">JPG, PNG or WebP &middot; 2 to 4 images</p>
          <input
            id="photo-input"
            type="file"
            accept="image/*"
            multiple
            aria-label="Choose 2 to 4 photos">
        </div>
      </div>

      <div id="captions" class="control-group captions" hidden>
        <h2>2. Captions</h2>
        <label class="field" for="caption-1">
          <span>Photo 1</span>
          <input id="caption-1" type="text" maxlength="60" placeholder="Caption for photo 1" autocomplete="off">
        </label>
        <label class="field" for="caption-2">
          <span>Photo 2</span>
          <input id="caption-2" type="text" maxlength="60" placeholder="Caption for photo 2" autocomplete="off">
        </label>
        <label class="field" for="caption-3">
          <span>Photo 3</span>
          <input id="caption-3" type="text" maxlength="60" placeholder="Caption for photo 3" autocomplete="off">
        </label>
        <label class="field" for="caption-4">
          <span>Photo 4</span>
          <input id="caption-4" type="text" maxlength="60" placeholder="Caption for photo 4" autocomplete="off">
        </label>
      </div>

      <div class="control-group">
        <h2>3. Poster</h2>
        <label class="field" for="poster-title">
          <span>Title</span>
          <input id="poster-title" type="text" maxlength="40" placeholder="Vice City Nights" autocomplete="off">
        </label>
        <label class="field" for="template-select">
          <span>Template</span>
          <select id="template-select">
            <option value="vice-dusk" selected>Vice Dusk</option>
            <option value="neon-rain">Neon Rain</option>
            <option value="sunset-heist">Sunset Heist</option>
          </select>
        </label>
        <label class="field" for="palette-select">
          <span>Palette</span>
          <select id="palette-select">
            <option value="dusk-magenta" selected>Dusk Magenta</option>
            <option value="neon-cyan">Neon Cyan</option>
            <option value="sunset-gold">Sunset Gold</option>
            <option value="vice-noir">Vice Noir</option>
          </select>
        </label>
      </div>

      <button id="export-btn" type="button" class="export-btn">Export PNG</button>

      <p id="status" class="status" role="status" aria-live="polite">Add 2&ndash;4 photos to get started.</p>
    </section>

    <section class="preview" aria-label="Poster preview">
      <div class="poster-frame">
        <canvas id="poster" width="1024" height="1024">
          Your browser does not support the canvas element.
        </canvas>
      </div>
    </section>
  </main>

  <img id="hidden-cover" alt="" hidden>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
